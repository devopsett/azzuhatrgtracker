  <style>
    :root {
      --primary: #047857;
      --primary-hover: #065f46;
      --primary-dark: #064e3b;
      --primary-light: #ecfdf5;
      --accent: #10b981;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      
      --status-ok-bg: #dcfce7;
      --status-ok-text: #166534;
      --status-low-bg: #fef3c7;
      --status-low-text: #92400e;
      --status-empty-bg: #fee2e2;
      --status-empty-text: #991b1b;
      
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
      --radius: 12px;
    }

    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13.5px;
      line-height: 1.5;
    }

    .app-container {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: 100vh;
    }

    /* Sidebar Desktop */
    .sidebar {
      background: linear-gradient(180deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 20;
    }

    .brand-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      margin-bottom: 24px;
    }

    .brand-logo-img {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      object-fit: contain;
      background: rgba(255,255,255,0.15);
      padding: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .brand-title { font-size: 15px; font-weight: 800; line-height: 1.2; letter-spacing: -0.2px; }
    .brand-sub { font-size: 11px; opacity: 0.8; }

    .nav-list { display: grid; gap: 6px; list-style: none; }
    .nav-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.85);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    .nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .nav-btn.active {
      background: #ffffff;
      color: var(--primary-dark);
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    .sidebar-footer {
      margin-top: auto;
      font-size: 11px;
      opacity: 0.75;
      line-height: 1.4;
      border-top: 1px solid rgba(255,255,255,0.15);
      padding-top: 16px;
    }

    /* Bottom Navigation Khusus Mobile (PWA Feel) */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #ffffff;
      border-top: 1px solid var(--border);
      z-index: 50;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.06);
      grid-template-columns: repeat(3, 1fr);
      padding: 4px 8px;
      padding-bottom: env(safe-area-inset-bottom, 4px);
    }

    .m-nav-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.15s ease;
    }

    .m-nav-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      transition: all 0.15s ease;
    }

    .m-nav-btn.active {
      color: var(--primary);
      font-weight: 800;
    }

    .m-nav-btn.active svg {
      stroke: var(--primary);
      transform: scale(1.1);
    }

    /* Main Area */
    main { padding: 28px; overflow-y: auto; }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-title h2 { font-size: 22px; font-weight: 800; color: var(--text); }
    .header-title p { color: var(--text-muted); font-size: 12.5px; margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      min-height: 42px;
      border-radius: 10px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-secondary { background: white; border-color: var(--border); color: var(--text); }
    .btn-secondary:hover { background: #f1f5f9; }
    .btn-danger { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
    .btn-danger:hover { background: #fecaca; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    /* Mode Switcher Masuk / Keluar */
    .type-switcher {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--primary-light);
      padding: 5px;
      border: 1px solid rgba(4, 120, 87, 0.15);
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .type-btn {
      border: none;
      padding: 11px 12px;
      min-height: 42px;
      border-radius: 7px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      background: transparent;
      color: var(--primary);
      text-align: center;
    }

    .type-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
      font-weight: 700;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .metric-title { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .metric-val { font-size: 24px; font-weight: 800; color: var(--primary-dark); margin: 4px 0; }
    .metric-sub { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Panels & 50/50 Desktop Layout */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 24px;
      min-width: 0;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fafafa;
      flex-wrap: wrap;
      gap: 8px;
    }

    .panel-header h3 { font-size: 15px; font-weight: 700; }
    .panel-body { padding: 20px; }

    .two-col-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 20px;
      align-items: start;
    }

    /* Forms */
    .form-group { display: grid; gap: 14px; }
    .input-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    label { font-size: 11.5px; font-weight: 700; color: #475569; display: block; margin-bottom: 5px; }
    
    input, select, textarea {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      background: #fff;
      outline: none;
      transition: border 0.15s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(4, 120, 87, 0.1);
    }

    textarea { resize: vertical; min-height: 75px; }

    /* Data Tables */
    .table-container {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fff;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: left;
    }

    th {
      background: #f8fafc;
      color: #475569;
      font-weight: 700;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
    }

    .badge-ok { background: var(--status-ok-bg); color: var(--status-ok-text); }
    .badge-low { background: var(--status-low-bg); color: var(--status-low-text); }
    .badge-empty { background: var(--status-empty-bg); color: var(--status-empty-text); }

    /* Batch Rows */
    .batch-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      background: #fdfdfd;
      margin-bottom: 14px;
    }

    .batch-item-row {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 1.2fr) auto;
      gap: 10px;
      align-items: end;
      margin-bottom: 10px;
    }

    /* Modal / Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      z-index: 100;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scanner Modal Popup & Camera Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.82);
      backdrop-filter: blur(5px);
      display: grid;
      place-items: center;
      z-index: 110;
      padding: 14px;
    }

    .scanner-dialog {
      background: #ffffff;
      border-radius: 16px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .scanner-header {
      padding: 16px 20px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .scanner-header h4 { font-size: 14px; font-weight: 800; color: var(--text); }

    .scanner-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .scanner-camera-wrapper {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    #scannerReader {
      width: 100%;
    }

    .scanner-overlay-toast {
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      background: rgba(4, 120, 87, 0.95);
      color: #ffffff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      backdrop-filter: blur(4px);
      transform: translateY(-50px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
      z-index: 10;
    }

    .scanner-overlay-toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .scanner-overlay-toast.error {
      background: rgba(185, 28, 28, 0.95);
    }

    .scanner-hint {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 12px;
      text-align: center;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 12px 20px;
      background: var(--primary-dark);
      color: #fff;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 101;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.error { background: #991b1b; }

    .hidden { display: none !important; }

    /* Media Queries */
    @media (max-width: 1100px) {
      .metrics-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .two-col-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 768px) {
      .app-container {
        grid-template-columns: 1fr;
        padding-bottom: 74px;
      }

      .sidebar { display: none; }
      .mobile-bottom-nav { display: grid; }

      main { padding: 16px; }

      .header-bar {
        margin-bottom: 16px;
        flex-direction: column;
        align-items: flex-start;
      }

      .header-actions {
        width: 100%;
      }

      .header-actions .btn {
        flex: 1;
      }

      .metrics-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 16px;
      }

      .metric-card {
        padding: 12px;
      }

      .metric-val {
        font-size: 20px;
      }

      .panel-body {
        padding: 14px;
      }

      .input-row {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .batch-item-row {
        grid-template-columns: 1fr;
        background: #f8fafc;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
      }

      .batch-item-row .btn-secondary {
        width: 100%;
      }

      .toast {
        left: 16px;
        right: 16px;
        bottom: 80px;
        text-align: center;
      }
    }
  </style>
</head>
